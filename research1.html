<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>无人机具身智能 | 3DSTAILab</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- 1. 引入 DaisyUI 和 Tailwind -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.2/dist/full.min.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/common.js"></script>
  
  <!-- 2. 引入 FontAwesome 图标 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- 添加这一段 CSS 来让滚动条更好看 -->
  <style>
    /* 强制开启滚动条 */
    .carousel {
      display: flex !important;
      overflow-x: auto !important;
      overflow-y: hidden !important;
      scroll-snap-type: x mandatory !important;
      -webkit-overflow-scrolling: touch !important;
    }

    /* 强制显示滚动条 */
    .carousel::-webkit-scrollbar {
      display: block !important;
      height: 8px !important;
      width: 8px !important;
    }
    
    .carousel::-webkit-scrollbar-track {
      background: #e2e8f0 !important;
      border-radius: 10px !important;
    }
    
    .carousel::-webkit-scrollbar-thumb {
      background: #94a3b8 !important;
      border-radius: 10px !important;
    }
    
    .carousel::-webkit-scrollbar-thumb:hover {
      background: #64748b !important;
    }

    /* 确保滚动条在 Firefox 中可见 */
    .carousel {
      scrollbar-width: auto !important;
      scrollbar-color: #94a3b8 #e2e8f0 !important;
    }
  </style>
</head>

<body class="font-sans min-h-screen bg-gray-50 text-slate-800 flex flex-col">

  <!-- 导航栏由 common.js 自动注入 -->

  <!-- ========================
       2. 主体内容
       ======================== -->
  <main class="flex-grow container mx-auto px-4 py-8 pt-28 max-w-5xl">
    
  <!-- ==================== 研究方向 Gallery ==================== -->
  <section class="mt-12">
    <div class="flex items-center justify-between mb-8 border-b border-gray-200 pb-4">

        <p class="text-gray-500 text-lg">UAV Embodied Intelligence</p>
      </div>
    </div>
    <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-200 space-y-10">

      <!-- 地点时间标题 -->

      </div> -->

        <!-- 滚动容器 -->
        <!-- 1. overflow-x-auto: 允许横向滚动 -->

        <!-- 3. scrollbar-hide: 如果想隐藏原生滚动条，若要显示则去掉 -->
        <div class="carousel w-full p-4 space-x-4 bg-white rounded-box border border-gray-100 shadow-sm overflow-x-auto">
          
          <!-- 图片单元 -->
          <!-- flex-none: 保证图片不会被挤压 -->
          <div class="carousel-item flex-none w-118 h-72 relative rounded-xl overflow-hidden shadow-md group">
            <img src="#"  class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-110" />
          </div>

         <div class="carousel-item flex-none w-118 h-72 relative rounded-xl overflow-hidden shadow-md group">

          </div>

            <img src="#"  class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-110" />
          </div>
          
          <div class="carousel-item flex-none w-118 h-72 relative rounded-xl overflow-hidden shadow-md group">
            <img src="#"  class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-110" />
          </div>

        </div>


    </div>
  </section>
  </main>
  
  <!-- 页脚由 common.js 自动注入 -->

</body>
</html>
